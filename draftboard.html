<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor 51 · Draft Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0d1a;color:#fff;font-family:'Inter',sans-serif}

/* HEADER */
.hdr{background:linear-gradient(135deg,#1a1a3e,#0d0d1a);border-bottom:2px solid #D4A017;padding:7px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;flex-shrink:0}
.ht{font-family:'Cinzel',serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,#D4A017,#FF4500,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hs{font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:4px;color:rgba(212,160,23,.6)}
.now{background:linear-gradient(135deg,rgba(212,160,23,.2),rgba(255,69,0,.15));border:2px solid #D4A017;border-radius:9px;padding:5px 18px;text-align:center;min-width:190px}
.nl{font-family:'Bebas Neue',sans-serif;font-size:8px;letter-spacing:3px;color:#D4A017}
.nn{font-family:'Cinzel',serif;font-size:20px;font-weight:700}
.ni{font-size:9px;color:rgba(255,255,255,.4)}
.btn{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.bu{background:rgba(231,76,60,.2);color:#e74c3c;border:1px solid rgba(231,76,60,.35)}
.br{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15)}

/* MAIN LAYOUT */
.main{display:flex;height:calc(100vh - 52px)}

/* LEFT: Draft Board */
.dboard{width:440px;flex-shrink:0;display:flex;flex-direction:column;background:#111122;border-right:1px solid rgba(255,255,255,.07);padding:8px 10px;overflow:hidden}
.dbt{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;color:#D4A017;text-align:center;margin-bottom:5px;flex-shrink:0}
.rows{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.mr{display:flex;align-items:center;gap:3px;padding:2px 5px;border-radius:5px}
.mr.cur{background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.3)}
.mn{font-family:'Bebas Neue',sans-serif;font-size:13px;width:82px;flex-shrink:0;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn.cur{color:#D4A017;font-size:14px}
.ps{flex:1;height:26px;border-radius:4px;font-size:8px;font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.pt{background:rgba(212,168,0,.22);border-color:rgba(212,168,0,.4);color:#ffe066}
.pv{background:rgba(123,45,139,.28);border-color:rgba(123,45,139,.5);color:#d9a8f5}
.pe{background:rgba(93,64,55,.28);border-color:rgba(93,64,55,.5);color:#bcaaa4}
.pm{background:rgba(255,255,255,.03);color:rgba(255,255,255,.12)}
.pn{background:rgba(212,160,23,.1);border:1px dashed #D4A017;color:#D4A017;animation:blink 1.4s ease-in-out infinite;font-size:10px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* RIGHT: Name cards */
.cast{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 14px;gap:10px}
.tribe-row{display:flex;flex-direction:column;gap:5px}
.tribe-label{font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:3px;padding:4px 12px;border-radius:4px;display:inline-block;align-self:flex-start}
.tl-t{background:#D4A800;color:#000}
.tl-s{background:#7B2D8B;color:#fff}
.tl-e{background:#5D4037;color:#fff}
.player-row{display:flex;gap:5px}

/* Individual name card */
.nc{flex:1;border-radius:8px;padding:8px 4px 0;cursor:pointer;transition:transform .12s,opacity .12s;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;position:relative}
.nc:hover:not(.done-card){transform:scale(1.06);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.nc.done-card{opacity:.25;cursor:not-allowed}
.nc.tok{background:rgba(212,168,0,.15);border-color:rgba(212,168,0,.5)}
.nc.sav{background:rgba(123,45,139,.2);border-color:rgba(123,45,139,.5)}
.nc.exl{background:rgba(93,64,55,.2);border-color:rgba(93,64,55,.5)}
.nc-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;padding:0 2px}
.nc-count{width:100%;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:1px;padding:3px 2px 4px;border-radius:0 0 6px 6px;margin-top:5px}
.k6{background:#4472C4;color:#fff}
.k5{background:#FFE066;color:#222}
.k4{background:#F4A942;color:#222}
.k3{background:#FF9999;color:#222}
.k2{background:#C00000;color:#fff}
.k1{background:#C8C8C8;color:#333}
.k0{background:#111;color:#555}

.done-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:16px}
.done-title{font-family:'Cinzel',serif;font-size:44px;font-weight:700;background:linear-gradient(135deg,#D4A017,#FF4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const BASE = 'https://turnto10.com/resources/media2/16x9/1280/800/center/80/';
const CONTESTANTS = [
  {id:'thienan', name:'Thien An',tribe:'Toka'},
  {id:'jelly',   name:'Jelly',   tribe:'Toka'},
  {id:'brady',   name:'Brady',   tribe:'Toka'},
  {id:'kilby',   name:'Kilby',   tribe:'Toka'},
  {id:'devin',   name:'Devin',   tribe:'Toka'},
  {id:'jenna',   name:'Jenna',   tribe:'Toka'},
  {id:'maggie',  name:'Maggie',  tribe:'Toka'},
  {id:'mikep',   name:'Mike P',  tribe:'Toka'},
  {id:'patt',    name:'Patt',    tribe:'Toka'},
  {id:'alexis',  name:'Alexis',  tribe:'Savu'},
  {id:'ana',     name:'Ana',     tribe:'Savu'},
  {id:'carter',  name:'Carter',  tribe:'Savu'},
  {id:'cristian',name:'Cristian',tribe:'Savu'},
  {id:'eric',    name:'Eric',    tribe:'Savu'},
  {id:'kristin', name:'Kristin', tribe:'Savu'},
  {id:'linnea',  name:'Linnea',  tribe:'Savu'},
  {id:'ori',     name:'Ori',     tribe:'Savu'},
  {id:'rob',     name:'Rob',     tribe:'Savu'},
  {id:'sharonda',name:'Sharonda',tribe:'Savu'},
  {id:'lewis',   name:'Lewis',   tribe:'Exile'},
];

const MGR=['Neil','Julie','Lindsay','Jason','Debbie','David','Jenny','Alex','Mel','Brett/Emma','Dan','Danielle','Gab','Grayson','Jenn','Jack','Dale','Sue','Charlie'];
const N=MGR.length,PP=6,TOT=N*PP,MAX=6,SK='s51d_v5';
const SNAKE=[];
for(let r=0;r<PP;r++){if(r%2===0){for(let i=0;i<N;i++)SNAKE.push(i);}else{for(let i=N-1;i>=0;i--)SNAKE.push(i);}}

function load(){try{const s=localStorage.getItem(SK);if(s)return JSON.parse(s);}catch(e){}return{picks:[]};}
function sv(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
function kc(l){return['k0','k1','k2','k3','k4','k5','k6'][Math.min(l,6)]||'k0';}
function tc(t){return t==='Toka'?'tok':t==='Savu'?'sav':'exl';}
function ps(t){return t==='Toka'?'pt':t==='Savu'?'pv':'pe';}

function App(){
  const [st,setSt]=useState(load);
  const picks=st.picks,cur=picks.length,done=cur>=TOT;
  const cmi=done?null:SNAKE[cur],cm=done?null:MGR[cmi];

  const dc={};CONTESTANTS.forEach(c=>dc[c.id]=0);
  picks.forEach(p=>{if(p.cid in dc)dc[p.cid]++;});

  const mp=MGR.map(()=>Array(PP).fill(null));
  picks.forEach(p=>{mp[p.mi][Math.floor(p.num/N)]=p.cid;});

  function draft(cid){
    if(done)return;
    if(dc[cid]>=MAX)return;
    const ns={picks:[...picks,{num:cur,mi:cmi,cid}]};setSt(ns);sv(ns);
  }
  function undo(){if(!picks.length)return;const ns={picks:picks.slice(0,-1)};setSt(ns);sv(ns);}
  function reset(){if(!confirm('Reset the entire draft board?'))return;const ns={picks:[]};setSt(ns);sv(ns);}

  function nameCard(c){
    const left=MAX-dc[c.id],maxed=left===0;
    return(
      <div key={c.id} className={'nc '+tc(c.tribe)+(maxed?' done-card':'')}
        onClick={()=>draft(c.id)} title={maxed?c.name+' — DONE':c.name+' · '+left+' left'}>
        <div className="nc-name">{c.name}</div>
        <div className={'nc-count '+kc(left)}>{maxed?'DONE':left}</div>
      </div>
    );
  }

  const toka=CONTESTANTS.filter(c=>c.tribe==='Toka');
  const savu=CONTESTANTS.filter(c=>c.tribe==='Savu');
  const exile=CONTESTANTS.filter(c=>c.tribe==='Exile');

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      {done&&(
        <div className="done-overlay">
          <div style={{fontSize:'52px'}}>🔥</div>
          <div className="done-title">DRAFT COMPLETE!</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",letterSpacing:'3px',color:'rgba(255,255,255,.4)'}}>MAY THE BEST TEAM WIN</div>
          <button className="btn br" onClick={reset} style={{marginTop:'10px'}}>RESET BOARD</button>
        </div>
      )}

      {/* HEADER */}
      <div className="hdr">
        <div>
          <div className="hs">FANTASY LEAGUE · THE OPEN ERA</div>
          <div className="ht">SURVIVOR 51 · LIVE DRAFT</div>
        </div>
        {!done&&(
          <div className="now">
            <div className="nl">Now Drafting</div>
            <div className="nn">{cm}</div>
            <div className="ni">Pick #{cur+1} · Round {Math.floor(cur/N)+1} · {(cur%N)+1} of {N}</div>
          </div>
        )}
        <div style={{display:'flex',gap:'7px',alignItems:'center'}}>
          <div style={{fontSize:'10px',color:'rgba(255,255,255,.35)',textAlign:'right',lineHeight:'1.7'}}>
            <div>{picks.length}/{TOT} picks made</div>
            <div>19 mgrs · 6 picks · max 6</div>
          </div>
          <button className="btn bu" onClick={undo} disabled={!picks.length}>↩ UNDO</button>
          <button className="btn br" onClick={reset}>RESET</button>
        </div>
      </div>

      {/* MAIN */}
      <div className="main">
        {/* DRAFT BOARD */}
        <div className="dboard">
          <div className="dbt">📋 DRAFT BOARD</div>
          <div className="rows">
            {MGR.map((m,mi)=>{
              const isc=mi===cmi&&!done;
              const filled=picks.filter(p=>p.mi===mi).length;
              return(
                <div key={m} className={'mr'+(isc?' cur':'')}>
                  <div className={'mn'+(isc?' cur':'')}>{isc?'▶ ':''}{m}</div>
                  {mp[mi].map((cid,si)=>{
                    const c=cid?CONTESTANTS.find(x=>x.id===cid):null;
                    if(c)return<div key={si} className={'ps '+ps(c.tribe)}>{c.name}</div>;
                    if(isc&&si===filled)return<div key={si} className="ps pn">PICK</div>;
                    return<div key={si} className="ps pm">—</div>;
                  })}
                </div>
              );
            })}
          </div>
        </div>

        {/* CAST NAME CARDS */}
        <div className="cast">
          <div className="tribe-row">
            <div className="tribe-label tl-t">🟡 TOKA</div>
            <div className="player-row">{toka.map(nameCard)}</div>
          </div>
          <div className="tribe-row">
            <div className="tribe-label tl-s">🟣 SAVU</div>
            <div className="player-row">{savu.map(nameCard)}</div>
          </div>
          <div className="tribe-row">
            <div className="tribe-label tl-e">🟫 EXILE</div>
            <div className="player-row">{exile.map(nameCard)}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
