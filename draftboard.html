<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor 51 · Draft Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0d1a;color:#fff;font-family:'Inter',sans-serif}

.hdr{background:linear-gradient(135deg,#1a1a3e,#0d0d1a);border-bottom:2px solid #D4A017;padding:7px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.ht{font-family:'Cinzel',serif;font-size:18px;font-weight:700;background:linear-gradient(135deg,#D4A017,#FF4500,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hs{font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:4px;color:rgba(212,160,23,.6)}
.now{background:linear-gradient(135deg,rgba(212,160,23,.2),rgba(255,69,0,.15));border:2px solid #D4A017;border-radius:9px;padding:5px 18px;text-align:center;min-width:190px}
.nl{font-family:'Bebas Neue',sans-serif;font-size:8px;letter-spacing:3px;color:#D4A017}
.nn{font-family:'Cinzel',serif;font-size:20px;font-weight:700}
.ni{font-size:9px;color:rgba(255,255,255,.4)}
.btn{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:6px 12px;border:none;border-radius:6px;cursor:pointer}
.bu{background:rgba(231,76,60,.2);color:#e74c3c;border:1px solid rgba(231,76,60,.35)}
.br{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15)}

.main{display:flex;height:calc(100vh - 52px);overflow:hidden}

/* ── DRAFT BOARD ── */
.dboard{width:520px;flex-shrink:0;display:flex;flex-direction:column;background:#111122;border-right:1px solid rgba(255,255,255,.08);padding:8px 12px}
.dbt{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;color:#D4A017;text-align:center;margin-bottom:5px;flex-shrink:0}
.rows{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.mr{display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px}
.mr.cur{background:rgba(212,160,23,.15);border:1px solid rgba(212,160,23,.3)}
.mn{font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.5px;width:90px;flex-shrink:0;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn.cur{color:#D4A017;font-size:16px}
.ps{flex:1;height:28px;border-radius:4px;font-size:10px;font-family:'Bebas Neue',sans-serif;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;border:1px solid rgba(255,255,255,.07);padding:0 2px}
.pt{background:rgba(212,168,0,.25);border-color:rgba(212,168,0,.45);color:#ffe066}
.pv{background:rgba(123,45,139,.3);border-color:rgba(123,45,139,.5);color:#d9a8f5}
.pe{background:rgba(93,64,55,.3);border-color:rgba(93,64,55,.5);color:#bcaaa4}
.pm{background:rgba(255,255,255,.03);color:rgba(255,255,255,.12)}
.pn{background:rgba(212,160,23,.1);border:1px dashed #D4A017;color:#D4A017;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ── RIGHT PANEL ── */
.rp{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* player table */
.ptable{display:flex;gap:8px;padding:8px 10px 4px;flex-shrink:0}
.tribe-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.exile-col{width:160px;flex-shrink:0;display:flex;flex-direction:column;gap:0}

.tribe-col-header{font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:3px;padding:5px 12px;border-radius:5px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.tch-t{background:#D4A800;color:#000}
.tch-s{background:#7B2D8B;color:#fff}
.tch-e{background:#5D4037;color:#fff}

/* col sub-header */
.col-sub{display:grid;grid-template-columns:1fr 44px 38px;gap:3px;margin-bottom:3px;padding:0 2px}
.cs{font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:1px;color:rgba(255,255,255,.3);text-align:center}

/* Player row */
.prow{display:grid;grid-template-columns:1fr 44px 38px;gap:3px;align-items:center;margin-bottom:3px;cursor:pointer;border-radius:5px;transition:all .12s}
.prow:hover:not(.done-row){filter:brightness(1.2);transform:scale(1.01)}
.prow.done-row{opacity:.25;cursor:not-allowed}
.ptribe{border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:10px;letter-spacing:.5px;text-align:center;padding:5px 2px}
.tt{background:#D4A800;color:#000}
.ss{background:#7B2D8B;color:#fff}
.ee{background:#5D4037;color:#fff}
.pname{background:rgba(255,255,255,.09);border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.5px;padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pscore{border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:13px;text-align:center;padding:5px 2px;background:rgba(78,204,163,.12);border:1px solid rgba(78,204,163,.25);color:#4ecca3}
.pcount{border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;text-align:center;padding:5px 2px}

/* Legend */
.legend{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.leg-item{border-radius:4px;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:1px;text-align:center;padding:4px 6px}

/* Pick count colors */
.k6{background:#4472C4;color:#fff}
.k5{background:#FFE066;color:#222}
.k4{background:#F4A942;color:#222}
.k3{background:#FF9999;color:#222}
.k2{background:#C00000;color:#fff}
.k1{background:#C8C8C8;color:#333}
.k0{background:#111;color:#555}

/* ── PHOTOS ── */
.photos{flex:1;padding:4px 10px 6px;display:flex;flex-direction:column;gap:5px;border-top:1px solid rgba(255,255,255,.08);min-height:0}
.photo-tribe{display:flex;align-items:stretch;gap:5px;flex:1;min-height:0}
.ptl{font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;writing-mode:vertical-lr;transform:rotate(180deg);padding:4px 3px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;min-width:22px}
.ptl-t{background:#D4A800;color:#000}
.ptl-s{background:#7B2D8B;color:#fff}
.ptl-e{background:#5D4037;color:#fff}
.photo-grid{display:flex;gap:4px;flex:1;min-width:0}
.pc{flex:1;border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.12);min-width:0;max-width:10.5%;display:flex;flex-direction:column}
.pc.t2{border-color:rgba(212,168,0,.5)}
.pc.s2{border-color:rgba(123,45,139,.5)}
.pc.e2{border-color:rgba(93,64,55,.5)}
.pc img{width:100%;flex:1;object-fit:cover;object-position:top center;display:block;background:#222;min-height:0;object-position:20% 5%}
.pc .pn2{background:rgba(0,0,0,.85);font-family:'Bebas Neue',sans-serif;font-size:9px;letter-spacing:.5px;text-align:center;padding:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}

.done-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:16px}
.done-title{font-family:'Cinzel',serif;font-size:44px;font-weight:700;background:linear-gradient(135deg,#D4A017,#FF4500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;
const BASE = 'https://turnto10.com/resources/media2/16x9/1280/800/center/80/';
const CONTESTANTS = [
  {id:'thienan', name:'Thien An',tribe:'Toka', ep1:0.50, photo:BASE+'1d72888c-3e41-4b2d-9d59-f356f2cbac64-TheinAnNguyen.png'},
  {id:'jelly',   name:'Jelly',   tribe:'Toka', ep1:0.50, photo:BASE+'1d94ac9c-0787-46f2-91d6-fdb707b65637-JellyLoblack.png'},
  {id:'brady',   name:'Brady',   tribe:'Toka', ep1:0.50, photo:BASE+'05d9ecae-69eb-46d0-a6c3-e24daa6a1c28-BradyBooker.png'},
  {id:'kilby',   name:'Kilby',   tribe:'Toka', ep1:0.50, photo:BASE+'34e0d308-5c3e-4c09-bb32-14fee7b707b0-DannyKilby.png'},
  {id:'devin',   name:'Devin',   tribe:'Toka', ep1:0.50, photo:BASE+'a7ab02ab-53f6-4f8e-a9d3-103de9a146e1-DevinWay.png'},
  {id:'jenna',   name:'Jenna',   tribe:'Toka', ep1:0.50, photo:BASE+'06d841bb-cf45-4d48-8483-4351aa7cc147-JennaDoore.png'},
  {id:'maggie',  name:'Maggie',  tribe:'Toka', ep1:0.50, photo:BASE+'a2d3b5e4-4e2e-4869-a1b5-ffc08030e03f-MaggieNestor.png'},
  {id:'mikep',   name:'Mike P',  tribe:'Toka', ep1:0.50, photo:BASE+'76003c77-5106-4a3f-b7df-ad0971aad662-MikePinsky.png'},
  {id:'patt',    name:'Patt',    tribe:'Toka', ep1:0.50, photo:BASE+'f10d2fde-caf7-4d9f-8c4f-d5b92fda5dd6-PattCannaday.png'},
  {id:'alexis',  name:'Alexis',  tribe:'Savu', ep1:1.00, photo:BASE+'4c49b157-5964-45ca-963d-295eb24478da-AlexisLevine.png'},
  {id:'ana',     name:'Ana',     tribe:'Savu', ep1:1.00, photo:BASE+'eb9e90cc-9964-4fca-bd9d-2940d1ef72eb-AnaSani.png'},
  {id:'carter',  name:'Carter',  tribe:'Savu', ep1:1.00, photo:BASE+'28e202ec-6802-49b0-8fc7-f42504b8850f-CarterKrull.png'},
  {id:'cristian',name:'Cristian',tribe:'Savu', ep1:1.00, photo:BASE+'c5fe29ca-1071-4fb5-81e6-e355894b6fe3-CristianChavez.png'},
  {id:'eric',    name:'Eric',    tribe:'Savu', ep1:1.00, photo:BASE+'c6f23588-ed4d-48b3-b009-67a0b06911c0-EricMacksound.png'},
  {id:'kristin', name:'Kristin', tribe:'Savu', ep1:1.00, photo:BASE+'7012944f-38af-4971-a5bf-9c4a41d3ca00-KristinFlickinger.png'},
  {id:'linnea',  name:'Linnea',  tribe:'Savu', ep1:1.00, photo:BASE+'b6fac4a6-e910-4c00-906d-5c4b5a0248d4-LinneaCapobianco.png'},
  {id:'ori',     name:'Ori',     tribe:'Savu', ep1:1.00, photo:BASE+'637f6f72-82c2-4a63-bb14-f8bb53c01959-OriJeanCharles.png'},
  {id:'rob',     name:'Rob',     tribe:'Savu', ep1:1.00, idol:true,  photo:BASE+'12b3ddb4-fc45-49e2-aa40-9234adf28d25-RobAntonson.png'},
  {id:'sharonda',name:'Sharonda',tribe:'Savu', ep1:1.00, photo:BASE+'bbb97a5d-5cdf-4728-9fa6-a196321f18a9-SharondaCox.png'},
  {id:'lewis',   name:'Lewis',   tribe:'Exile',ep1:0.25, photo:BASE+'4ebc18d6-96a9-468c-aefd-3e49f6fd89ec-LewisKelly.png'},
];
const MGR=['Jack','Mel','Julie','Neil','Grayson','Brett/Emma','Dan','Dale','Charlie','Jenn','Sue','Jason','Jenny','Gab','David','Danielle','Debbie','Alex','Lindsay'];
const N=MGR.length,PP=6,TOT=N*PP,MAX=6,SK='s51d_v7';
const SNAKE=[];
for(let r=0;r<PP;r++){if(r%2===0){for(let i=0;i<N;i++)SNAKE.push(i);}else{for(let i=N-1;i>=0;i--)SNAKE.push(i);}}
function load(){try{const s=localStorage.getItem(SK);if(s)return JSON.parse(s);}catch(e){}return{picks:[]};}
function sv(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}
function kc(l){return['k0','k1','k2','k3','k4','k5','k6'][Math.min(l,6)];}
function psc(t){return t==='Toka'?'pt':t==='Savu'?'pv':'pe';}
function tc(t){return t==='Toka'?'tt':t==='Savu'?'ss':'ee';}
function pc2(t){return t==='Toka'?'t2':t==='Savu'?'s2':'e2';}

function App(){
  const [st,setSt]=useState(load);
  const picks=st.picks,cur=picks.length,done=cur>=TOT;
  const cmi=done?null:SNAKE[cur],cm=done?null:MGR[cmi];
  const dc={};CONTESTANTS.forEach(c=>dc[c.id]=0);
  picks.forEach(p=>{if(p.cid in dc)dc[p.cid]++;});
  const mp=MGR.map(()=>Array(PP).fill(null));
  picks.forEach(p=>{mp[p.mi][Math.floor(p.num/N)]=p.cid;});

  function draft(cid){if(done||dc[cid]>=MAX)return;const ns={picks:[...picks,{num:cur,mi:cmi,cid}]};setSt(ns);sv(ns);}
  function undo(){if(!picks.length)return;const ns={picks:picks.slice(0,-1)};setSt(ns);sv(ns);}
  function reset(){if(!confirm('Reset draft board?'))return;const ns={picks:[]};setSt(ns);sv(ns);}

  function pRow(c){
    const left=MAX-dc[c.id],maxed=left===0;
    return(
      <div key={c.id} className={'prow'+(maxed?' done-row':'')} onClick={()=>draft(c.id)} title={maxed?c.name+' DONE':c.name+' · '+left+' left'}>
        
        <div className="pname">{c.name}{c.idol ? ' 🏺' : ''}</div>
        <div className="pscore">+{c.ep1}</div>
        <div className={'pcount '+kc(left)}>{maxed?'✅':left}</div>
      </div>
    );
  }

  function photoCard(c){
    const left=MAX-dc[c.id],maxed=left===0;
    return(
      <div key={c.id} className={'pc '+pc2(c.tribe)} style={{opacity:maxed?.25:1}} title={c.name+' · '+left+' left'}>
        <img src={c.photo} alt={c.name} onError={e=>{e.target.style.background='#2a2a3a';}}/>
        <div className="pn2">{c.name}</div>
      </div>
    );
  }

  const toka=CONTESTANTS.filter(c=>c.tribe==='Toka');
  const savu=CONTESTANTS.filter(c=>c.tribe==='Savu');
  const exile=CONTESTANTS.filter(c=>c.tribe==='Exile');

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100vh'}}>
      {done&&(
        <div className="done-overlay">
          <div style={{fontSize:'52px'}}>🔥</div>
          <div className="done-title">DRAFT COMPLETE!</div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",letterSpacing:'3px',color:'rgba(255,255,255,.4)'}}>MAY THE BEST TEAM WIN</div>
          <button className="btn br" onClick={reset} style={{marginTop:'10px'}}>RESET BOARD</button>
        </div>
      )}
      <div className="hdr">
        <div><div className="hs">FANTASY LEAGUE · THE OPEN ERA</div><div className="ht">SURVIVOR 51 · LIVE DRAFT</div></div>
        <img src="https://www.paramountpressexpress.com/cbs-entertainment/shows/survivor/images/asset/MTkyOTI4My9zdXJ2aXZvci9pbWFnZXMvc2hvd19pbWFnZXMvU3Vydml2b3JfUzUxX0tleUFydC5qcGc=" 
          alt="Survivor 51" 
          style={{height:'42px',objectFit:'contain'}}
          onError={e=>{e.target.style.display='none'}}
        />
        {!done&&(<div className="now"><div className="nl">Now Drafting</div><div className="nn">{cm}</div><div className="ni">Pick #{cur+1} · Round {Math.floor(cur/N)+1} · {(cur%N)+1} of {N}</div></div>)}
        <div style={{display:'flex',gap:'7px',alignItems:'center'}}>
          <div style={{fontSize:'10px',color:'rgba(255,255,255,.35)',textAlign:'right',lineHeight:'1.7'}}><div>{picks.length}/{TOT} picks</div><div>19 mgrs · 6 picks · max 6</div></div>
          <button className="btn bu" onClick={undo} disabled={!picks.length}>↩ UNDO</button>
          <button className="btn br" onClick={reset}>RESET</button>
        </div>
      </div>

      <div className="main">
        {/* DRAFT BOARD */}
        <div className="dboard">
          <div className="dbt">📋 DRAFT BOARD</div>
          <div className="rows">
            {MGR.map((m,mi)=>{
              const isc=mi===cmi&&!done,filled=picks.filter(p=>p.mi===mi).length;
              return(
                <div key={m} className={'mr'+(isc?' cur':'')}>
                  <div className={'mn'+(isc?' cur':'')}>{isc?'▶ ':''}{m}</div>
                  {mp[mi].map((cid,si)=>{
                    const c=cid?CONTESTANTS.find(x=>x.id===cid):null;
                    if(c)return<div key={si} className={'ps '+psc(c.tribe)}>{c.name}</div>;
                    if(isc&&si===filled)return<div key={si} className="ps pn">PICK</div>;
                    return<div key={si} className="ps pm">—</div>;
                  })}
                </div>
              );
            })}
          </div>
        </div>

        {/* RIGHT */}
        <div className="rp">
          {/* PLAYER TABLE */}
          <div className="ptable">
            {/* TOKA */}
            <div className="tribe-col">
              <div className="tribe-col-header tch-t">🟡 TOKA</div>
              <div className="col-sub"><div className="cs">NAME</div><div className="cs">EP1</div><div className="cs">LEFT</div></div>
              {toka.map(pRow)}
            </div>
            {/* SAVU */}
            <div className="tribe-col">
              <div className="tribe-col-header tch-s">🟣 SAVU</div>
              <div className="col-sub"><div className="cs">NAME</div><div className="cs">EP1</div><div className="cs">LEFT</div></div>
              {savu.map(pRow)}
            </div>
            {/* EXILE + LEGEND */}
            <div className="exile-col">
              <div className="tribe-col-header tch-e">🟫 EXILE</div>
              <div className="col-sub"><div className="cs">NAME</div><div className="cs">EP1</div><div className="cs">LEFT</div></div>
              {exile.map(pRow)}
              <div className="legend" style={{marginTop:'12px'}}>
                {[6,5,4,3,2,1,0].map(n=>(
                  <div key={n} className={'leg-item '+kc(n)}>{n===0?'DONE':n+' LEFT'}</div>
                ))}
              </div>
            </div>
          </div>

          {/* PHOTOS */}
          <div className="photos">
            <div className="photo-tribe">
              <div className="photo-grid">{toka.map(photoCard)}</div>
            </div>
            <div className="photo-tribe">
              <div className="photo-grid">{savu.map(photoCard)}</div>
            </div>
            <div className="photo-tribe">
              <div className="photo-grid">{exile.map(photoCard)}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
